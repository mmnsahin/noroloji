<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muayene – Nöroloji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
html{scroll-padding-top:70px}
:root{
  --paper:#F6F7F4; --card:#FFFFFF; --ink:#18211D; --muted:#5E6B64; --line:#D5DBD6;
  --scrub:#1D4E89; --scrub-tint:#E4ECF6; --warn:#8A5200; --warn-bg:#FBF1DF; --ok:#1F7A4D;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121614; --card:#1A201D; --ink:#E4EAE6; --muted:#9AA8A0; --line:#2C3531;
  --scrub:#8DB8EA; --scrub-tint:#1B2635; --warn:#F0B86A; --warn-bg:#2D2414; --ok:#6FCF97;}}
:root[data-theme="dark"]{
  --paper:#121614; --card:#1A201D; --ink:#E4EAE6; --muted:#9AA8A0; --line:#2C3531;
  --scrub:#8DB8EA; --scrub-tint:#1B2635; --warn:#F0B86A; --warn-bg:#2D2414; --ok:#6FCF97;}

*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
a{color:var(--scrub)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--scrub);outline-offset:2px}

.bar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.barin{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.home{flex:0 0 auto;font-weight:600;font-size:.95rem;text-decoration:none;white-space:nowrap;border:1px solid var(--scrub);border-radius:8px;padding:6px 12px}
.bartitle{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

header.top{max-width:900px;margin:0 auto;padding:28px 16px 12px}
header.top h1{font-size:clamp(1.7rem,3.5vw,2.4rem);line-height:1.15;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
header.top p{margin:0;color:var(--muted)}
.notice{margin:14px 0 0 !important;padding:10px 12px;background:var(--warn-bg);color:var(--warn) !important;border-radius:8px;font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.tools input[type=search]{flex:1 1 260px;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:1rem;font-family:inherit}
.tbtn{padding:8px 14px;border:1px solid var(--scrub);border-radius:8px;background:transparent;color:var(--scrub);font-weight:600;cursor:pointer}
.tbtn:hover{background:var(--scrub-tint)}

.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
.grp{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:28px 0 8px}

details.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:12px;align-items:center;padding:14px 16px}
details.sec>summary::-webkit-details-marker{display:none}
.st{font-weight:700;font-size:1.05rem;line-height:1.3}
.sd{display:block;font-weight:400;font-size:.88rem;color:var(--muted);margin-top:2px}
.prog{font-size:.85rem;font-weight:600;color:var(--scrub);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog.done{color:var(--ok)}
.chev{color:var(--muted);transition:transform .15s}
details.sec[open] .chev{transform:rotate(90deg)}
.sbody{padding:2px 16px 18px;border-top:1px solid var(--line)}

.tips,.ref{margin:14px 0 4px;padding:12px 14px;border-radius:10px;font-size:.93rem}
.tips{background:var(--scrub-tint)}
.tips b{color:var(--scrub)}
.tips ul{margin:6px 0 0;padding-left:20px}
.tips li{margin:3px 0}
.ref{border:1px solid var(--line)}
.ref b{display:block;margin-bottom:6px}
.ref table{border-collapse:collapse;width:100%}
.ref td{padding:4px 8px 4px 0;vertical-align:top;border-top:1px solid var(--line)}
.ref td:first-child{font-weight:600;white-space:nowrap;color:var(--scrub);width:1%}

h3.sub{font-size:1rem;margin:20px 0 6px;color:var(--scrub);border-bottom:2px solid var(--scrub-tint);padding-bottom:4px}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
.step{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:start;padding:9px 2px;cursor:pointer}
.step input{position:absolute;opacity:0;pointer-events:none}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border:1.5px solid var(--line);border-radius:50%;font-size:.85rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--card)}
.step input:checked+.num{background:var(--ok);border-color:var(--ok);color:#fff}
.step input:focus-visible+.num{outline:2px solid var(--scrub);outline-offset:2px}
.step input:checked~.txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.txt{font-family:var(--serif);font-size:1.02rem;line-height:1.55;padding-top:3px}
mark{background:#F5E27A;color:#18211D;border-radius:2px}
.none{color:var(--muted);padding:30px 0}
.rst{font-size:.85rem;margin-top:12px}

@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>
<body>
<div class="bar"><div class="barin"><a class="home" href="../index.html">Ana sayfa</a><span class="bartitle">Nörolojik muayene</span></div></div>
<header class="top">
  <h1>Nörolojik muayene</h1>
  <p id="cnt"></p>
  <div class="tools">
    <input type="search" id="s" placeholder="Muayene veya basamakta ara" aria-label="Ara">
    <button class="tbtn" id="o">Tümünü aç</button>
    <button class="tbtn" id="c">Tümünü kapat</button>
    <button class="tbtn" id="r">İşaretleri sıfırla</button>
  </div>
</header>
<div class="wrap"><main id="m"></main></div>
<script src="data.js"></script>
<script>
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const KEY='noroloji-muayene-v1';
let done={};
try{done=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){done={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
const m=document.getElementById('m'),s=document.getElementById('s');
const total=sec=>sec.subs.reduce((a,b)=>a+b.steps.length,0);
const doneCount=sec=>{let n=0;sec.subs.forEach((b,bi)=>b.steps.forEach((_,si)=>{if(done[sec.id+'.'+bi+'.'+si])n++}));return n};
const opened=new Set();

function render(){
  const f=s.value.trim().toLowerCase();
  const hl=f.length>=2?t=>t.replace(new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),x=>`<mark>${x}</mark>`):t=>t;
  let h='',lastGroup='',shown=0;
  MUAYENE.forEach(sec=>{
    const inSec=(sec.title+' '+sec.desc+' '+sec.tips.join(' ')).toLowerCase().includes(f);
    let body='',any=false;
    sec.subs.forEach((b,bi)=>{
      const subMatch=b.t.toLowerCase().includes(f);
      const rows=b.steps.map(([n,t],si)=>[n,t,si]).filter(([n,t])=>!f||inSec||subMatch||t.toLowerCase().includes(f));
      if(!rows.length)return;
      any=true;
      body+=(sec.subs.length>1||b.t!==sec.title?`<h3 class="sub">${hl(esc(b.t))}</h3>`:'')+'<ol class="steps">'+rows.map(([n,t,si])=>{
        const id=sec.id+'.'+bi+'.'+si;
        return `<li><label class="step"><input type="checkbox" data-id="${id}"${done[id]?' checked':''}><span class="num">${esc(n||'•')}</span><span class="txt">${hl(esc(t))}</span></label></li>`;
      }).join('')+'</ol>';
    });
    if(!any&&!inSec)return;
    shown++;
    if(sec.group!==lastGroup){h+=`<div class="grp">${esc(sec.group)}</div>`;lastGroup=sec.group}
    const tips=sec.tips.length?`<div class="tips"><b>Sözlüde sorulanlar / ipuçları</b><ul>${sec.tips.map(t=>`<li>${hl(esc(t))}</li>`).join('')}</ul></div>`:'';
    const r=sec.ref&&REFS[sec.ref];
    const ref=r?`<div class="ref"><b>${esc(r.t)}</b><table>${r.rows.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('')}</table></div>`:'';
    const dc=doneCount(sec),tt=total(sec);
    h+=`<details class="sec" data-sec="${sec.id}"${(f||opened.has(sec.id))?' open':''}><summary><span class="st">${hl(esc(sec.title))}<span class="sd">${hl(esc(sec.desc))}</span></span><span class="prog${dc===tt?' done':''}" data-prog="${sec.id}">${dc}/${tt}</span><span class="chev" aria-hidden="true">›</span></summary><div class="sbody">${tips}${ref}${body}</div></details>`;
  });
  m.innerHTML=h||`<p class="none">"${esc(s.value)}" için sonuç yok. Farklı bir kelime dene.</p>`;
  document.getElementById('cnt').textContent=f?`${shown} bölüm bulundu.`:`${MUAYENE.length} muayene bölümü, ${MUAYENE.reduce((a,x)=>a+total(x),0)} basamak.`;
}
m.addEventListener('change',e=>{
  const cb=e.target.closest('input[type=checkbox]');if(!cb)return;
  const id=cb.dataset.id;
  if(cb.checked)done[id]=1;else delete done[id];
  save();
  const sid=id.split('.')[0],sec=MUAYENE.find(x=>x.id===sid);
  const p=m.querySelector(`[data-prog="${sid}"]`),dc=doneCount(sec),tt=total(sec);
  p.textContent=dc+'/'+tt;p.classList.toggle('done',dc===tt);
});
m.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.sec')){d.open?opened.add(d.dataset.sec):opened.delete(d.dataset.sec)}},true);
let t;s.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(render,150)});
document.getElementById('o').onclick=()=>document.querySelectorAll('details.sec').forEach(d=>d.open=true);
document.getElementById('c').onclick=()=>document.querySelectorAll('details.sec').forEach(d=>d.open=false);
document.getElementById('r').onclick=()=>{if(Object.keys(done).length&&!confirm('Tüm işaretler silinsin mi?'))return;done={};save();render()};
render();
</script>
</body>
</html>
